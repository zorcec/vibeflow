components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: vbf_pat
  schemas:
    Task:
      type: object
      description: "v0 canonical task = local Task fields plus external id, counts, and createdAt alias. D3: responses carry BOTH id and externalId."
      properties:
        id:
          type: string
          description: "External id (cli_id ?? id on cloud; the local id locally)"
        externalId:
          type: string
          description: "Universal external id — equal to id on the local surface"
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - backlog
            - todo
            - in-progress
            - review
            - done
            - cancelled
        selector:
          type: string
        priority:
          type: string
        verified:
          type: boolean
          nullable: true
        links:
          type: array
          items:
            "$ref": "#/components/schemas/TaskLink"
        commentCount:
          type: integer
        fileCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - externalId
        - title
        - status
    TaskSummary:
      type: object
      properties:
        id:
          type: string
        externalId:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
            - backlog
            - todo
            - in-progress
            - review
            - done
            - cancelled
        commentCount:
          type: integer
        fileCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - externalId
        - title
        - status
    TaskList:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/TaskSummary"
        nextCursor:
          type: string
          nullable: true
      required:
        - items
    TaskCreate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - backlog
            - todo
            - in-progress
            - review
            - done
            - cancelled
        selector:
          type: string
          description: Optional in v0 (annotation is local-only); required by the local handler today
        priority:
          type: string
      required:
        - title
    TaskPatch:
      type: object
      description: All fields optional; status speaks the hyphenated set
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - backlog
            - todo
            - in-progress
            - review
            - done
            - cancelled
        priority:
          type: string
        verified:
          type: boolean
          nullable: true
    TaskLink:
      type: object
      properties:
        taskId:
          type: string
        type:
          type: string
          enum:
            - parent
            - relates
            - blocks
      required:
        - taskId
        - type
    TaskLinkInput:
      type: object
      description: "Body of POST /api/v0/tasks/{id}/links. Field names match what BOTH implementations actually read (the cloud v0 route and the local /api/tasks/:id handler): `taskId` is the id of the task to link TO. The earlier `target` spelling was wrong — a client following it got a 400."
      properties:
        type:
          type: string
          enum:
            - parent
            - relates
            - blocks
        taskId:
          type: string
          description: Id of the task to link to (external id on the cloud, local id locally)
      required:
        - type
        - taskId
    ClaimFilter:
      type: object
      properties:
        status:
          type: string
          enum:
            - backlog
            - todo
            - in-progress
            - review
            - done
            - cancelled
        tags:
          type: array
          items:
            type: string
    ClaimNext:
      type: object
      properties:
        task:
          oneOf:
            - "$ref": "#/components/schemas/Task"
            - type: "null"
              description: No actionable task
      required:
        - task
    VerifyAttestation:
      type: object
      description: "Agent attestation tri-state: pass/fail/cannot (+reason). 'cannot' also writes the Cannot-verify comment."
      properties:
        verdict:
          type: string
          enum:
            - pass
            - fail
            - cannot
        reason:
          type: string
      required:
        - verdict
    Comment:
      type: object
      description: "Ledger L1: author is explicit and preserved end to end."
      properties:
        id:
          type: string
        author:
          type: string
          enum:
            - user
            - agent
        text:
          type: string
        type:
          type: string
          enum:
            - comment
            - system
        source:
          type: string
          enum:
            - cli
            - web
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - author
        - text
    CommentList:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Comment"
        nextCursor:
          type: string
          nullable: true
      required:
        - items
    CommentInput:
      type: object
      properties:
        author:
          type: string
          enum:
            - user
            - agent
        text:
          type: string
          minLength: 1
      required:
        - text
    FileEntry:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
        mimeType:
          type: string
        system:
          type: boolean
      required:
        - name
    FileList:
      type: object
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/FileEntry"
        nextCursor:
          type: string
          nullable: true
      required:
        - items
    ScreenshotResult:
      type: object
      properties:
        success:
          type: boolean
        screenshot:
          type: string
      required:
        - success
    ScreenshotInput:
      type: object
      properties:
        screenshot:
          type: string
          contentEncoding: base64
      required:
        - screenshot
    BaselineResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    BaselineEnvelope:
      type: object
      description: Merges the two local baseline routes into one envelope
      properties:
        baseline:
          type: object
          description: "Element snapshot { selector, outerHTML }"
        page:
          type: object
          description: "Page-wide snapshot { version, elements, capturedAt }"
    AuthStateResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    AuthStateInput:
      type: object
      properties:
        authState:
          type: object
        taskAuthor:
          type: string
      required:
        - authState
        - taskAuthor
    Project:
      type: object
      description: "Scope description: local { kind: local, name, branch }; cloud { kind: board, ... }"
      properties:
        kind:
          type: string
          enum:
            - local
            - board
        name:
          type: string
        branch:
          type: string
          nullable: true
        boardId:
          type: string
        workspaceId:
          type: string
      required:
        - kind
    Principal:
      type: object
      properties:
        kind:
          type: string
          enum:
            - local
            - user
        userId:
          type: string
        scopes:
          type: array
          items:
            type: string
      required:
        - kind
    Settings:
      type: object
      description: UI preference keys
    Changelog:
      type: object
      description: CLI changelog payload
    PromptExport:
      type: object
      properties:
        prompt:
          type: string
      required:
        - prompt
    PromptExportInput:
      type: object
      properties:
        scope:
          type: string
          enum:
            - task
            - board
    McpSession:
      type: object
      description: StreamableHTTP session descriptor
    Token:
      type: object
      description: "Prefix-only token row — the secret is never re-revealable (plan §4.5)."
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: "Display prefix, e.g. vbf_pat_9f2c…"
        scopes:
          type: array
          items:
            type: string
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - prefix
        - scopes
    TokenList:
      type: object
      properties:
        tokens:
          type: array
          items:
            "$ref": "#/components/schemas/Token"
      required:
        - tokens
    TokenCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
      required:
        - name
        - scopes
    TokenSecret:
      type: object
      description: "Creation response — the secret appears here exactly once (plan §4.5)."
      properties:
        token:
          type: string
          description: "Full vbf_pat_ secret — shown once, never stored"
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
      required:
        - token
        - id
        - name
        - prefix
        - scopes
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: object
      required:
        - error
