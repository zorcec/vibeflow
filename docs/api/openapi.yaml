openapi: 3.1.0
info:
  title: Vibeflow API v0
  version: 0.1.0
  description: "Unified local + cloud task API. Locally the Phase 1 read alias (/api/v0, GET only) delegates to the local handler in localPath, and GET /api/docs renders this document. On the cloud surface, bearer calls carry per-token quotas — reads 300/min, writes 60/min, token creation 10/hour — and a quota-exceeding call answers 429 with Retry-After. Quota counters are PER-REPLICA in-memory counters, so the effective limit is the configured value × replicas (a shared store such as Redis is the future path if cross-replica enforcement is ever needed)."
servers:
  - url: "/"
    description: "Local board — try-it-out executes against this server"
paths:
  "/api/v0/tasks":
    get:
      operationId: list-tasks
      summary: List tasks with optional status filter and pagination
      description: "v0 returns task summary + counts with { items, nextCursor }; local returns { tasks: [...] } with commentCount/fileCount today."
      tags:
        - Tasks
      x-vibeflow-scope: "tasks:read"
      x-vibeflow-local: GET /api/tasks
      x-plan-row: 1
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - backlog
              - todo
              - in-progress
              - review
              - done
              - cancelled
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: "List tasks with optional status filter and pagination — success"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TaskList"
              examples:
                documented:
                  value:
                    items:
                      - id: a1b2c3d4e5f60718293a4b5c6d7e8f90
                        externalId: a1b2c3d4e5f60718293a4b5c6d7e8f90
                        title: Annotate the checkout button
                        status: todo
                        commentCount: 2
                        fileCount: 1
                        createdAt: "2026-10-10T09:00:00.000Z"
                    nextCursor: null
        "401":
          description: Missing or invalid principal
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Lacking scope or membership
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Rate limited — cloud per-token quota exceeded (reads 300/min, writes 60/min, token creation 10/hour); counters are per-replica, so the effective limit is the configured value × replicas. The response carries Retry-After."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth:
            []
      x-vibeflow-example-request:
        method: GET
        path: "/api/v0/tasks?status=todo&limit=2"
    post:
      operationId: create-task
      summary: Create a task
      description: "v0 makes 'selector' optional (annotation is local-only); local requires it today. Write — Phase 3."
      tags:
        - Tasks
      x-vibeflow-scope: "tasks:write"
      x-vibeflow-local: POST /api/tasks
      x-plan-row: 3
      parameters:
        []
      responses:
        "201":
          description: "Create a task — success"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Task"
              examples:
                documented:
                  value:
                    id: a1b2c3d4e5f60718293a4b5c6d7e8f90
                    externalId: a1b2c3d4e5f60718293a4b5c6d7e8f90
                    title: Annotate the checkout button
                    status: todo
                    priority: high
        "400":
          description: Malformed request (includes invalid task/comment id form)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: Missing or invalid principal
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Lacking scope or membership
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: Unknown id
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Rate limited — cloud per-token quota exceeded (reads 300/min, writes 60/min, token creation 10/hour); counters are per-replica, so the effective limit is the configured value × replicas. The response carries Retry-After."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TaskCreate"
            examples:
              documented:
                value:
                  title: Annotate the checkout button
                  status: todo
                  priority: high
      security:
        - bearerAuth:
            []
      x-vibeflow-example-request:
        method: POST
        path: "/api/v0/tasks"
