name: differential-canary

# P9 (ticket 0e5f5e06): the scheduled/low-frequency drift detector.
#
# The same-board differential between the built CLI and the MCP server runs
# here on a schedule (daily) and on every change to the CLI surface or the
# canary itself. A red run means the two renderers diverged on the same
# board — it blocks release promotion until triaged. The e2e differential
# suite (operation-differential.test.ts) runs in the same job so the
# in-suite acceptance and the black-box canary agree.
#
# The hosted disposable-board lane is the P9 follow-up (exact anchors in
# scripts/operation-drift-canary.mjs --lane hosted, which refuses loudly
# until that lane exists). This workflow runs the LOCAL lane only and must
# never be edited to fake the hosted one.

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/src/**"
      - "packages/cli/tests/e2e/operation-differential.test.ts"
      - "scripts/operation-drift-canary.mjs"
      - ".github/workflows/differential-canary.yml"
  schedule:
    # Daily drift detection (05:30 UTC): same-board CLI-vs-MCP comparison
    # on a disposable board, plus the e2e differential suite.
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build CLI (dist is what the CLI side and the canary drive)
        run: pnpm --filter @vibeflow-tools/cli run build
      - name: same-board differential e2e (CLI binary vs MCP server)
        run: pnpm --filter @vibeflow-tools/cli run test:e2e --
          tests/e2e/operation-differential.test.ts
      - name: scheduled drift canary (black-box CLI vs MCP stdio)
        run: pnpm run canary:differential
