name: a11y contrast

# Why a dedicated workflow: the contrast ratchet (`packages/ui/scripts/a11y-sweep.mjs`
# + `tests/visual/contrast-allowance.json`) only protects anything if something
# runs it. Before this file existed the script was referenced by no workflow, so
# the known-debt list could only grow when a human remembered to run
# `pnpm --filter @vibeflow-tools/ui run test:a11y`.
#
# What it enforces:
#   - a colour pair that is NOT in the allowance fails (a new regression cannot land),
#   - a pair that IS in the allowance but no longer fails also fails (the file may
#     only shrink),
#   - every run prints the outstanding count and the worst ratio still present.
#
# Re-recording with `--write` is the owner's call and must never be the response
# to a red run; the failure output names the story so the offending markup is
# obvious.
#
# Runtime: measured 2026-11-14 at ~4-6 minutes cold (it builds Storybook and then
# takes 1116 real-composited measurements, two per story that reports anything).
# That is the price of measuring contrast honestly — jsdom cannot composite.

on:
  push:
    branches: [main]
    paths:
      - "packages/ui/src/**"
      - "packages/ui/stories/**"
      - "packages/ui/scripts/a11y-sweep.mjs"
      - "packages/ui/tests/visual/contrast-allowance.json"
      - ".github/workflows/a11y.yml"
  pull_request:
    paths:
      - "packages/ui/src/**"
      - "packages/ui/stories/**"
      - "packages/ui/scripts/a11y-sweep.mjs"
      - "packages/ui/tests/visual/contrast-allowance.json"
      - ".github/workflows/a11y.yml"
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrast:
    name: colour contrast ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the sweep
        run: pnpm --filter @vibeflow-tools/ui exec playwright install --with-deps chromium

      - name: Contrast ratchet
        run: pnpm --filter @vibeflow-tools/ui run test:a11y

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-contrast-report
          path: |
            packages/ui/storybook-static/**/*.json
          retention-days: 7
