# Registers/releases the server manifest (server.json) on the official MCP
# Registry (registry.modelcontextprotocol.io). Auth is GitHub OIDC — no
# secrets required; the registry grants the io.github.zorcec namespace from
# the workflow's identity in this repository.
#
# npm publishing is NOT done here — it is owned by the release script in
# the private monorepo (deploy/scripts/publish-cli.sh), which also syncs
# the pinned version into server.json before the release commit. The
# registry verifies the referenced npm package/version exists, so this
# workflow can only publish a manifest whose release already landed on
# npm.
name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify server.json references a published npm version
        run: |
          VERSION=$(jq -r '.version' server.json)
          PKG=$(jq -r '.packages[0].identifier' server.json)
          echo "Checking ${PKG}@${VERSION} on npm..."
          npm view "${PKG}@${VERSION}" version

      - name: Install mcp-publisher
        run: |
          BASE="https://github.com/modelcontextprotocol/registry"
          REL="${BASE}/releases/latest/download"
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -L "${REL}/mcp-publisher_${OS}_${ARCH}.tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
