name: operation-contract

# P8 (ticket dc9a42ac): the CLI/MCP unification contract is enforced by
# remotely executed checks, not by local hooks alone. Direct pushes stay
# allowed; publishing/deployment must still require this workflow green
# for the published commit (see the release-gate job).
#
# The weekly schedule is the low-frequency drift detector for the LOCAL
# surface contract (registry identity, import boundaries, executable
# deltas). The same-board differential canary across CLI/MCP/API is a
# separate P9 lane with its own workflow.

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/src/**"
      - "packages/cli/tests/**"
      - "packages/api-core/src/**"
      - ".github/workflows/operation-contract.yml"
  pull_request:
    paths:
      - "packages/cli/src/**"
      - "packages/cli/tests/**"
      - "packages/api-core/src/**"
  schedule:
    # Weekly drift re-verification (Monday 06:00 UTC): catches contract
    # rot that no PR introduced (dependency drift, stale deltas).
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build CLI (dist is what e2e and the canary drive)
        run: pnpm --filter @vibeflow-tools/cli run build
      - name: typecheck
        run: pnpm --filter @vibeflow-tools/cli run lint
      - name: symbol lint
        run: pnpm run lint:symbols
      - name: registry artifact is current (exact-commit evidence)
        run: node packages/cli/scripts/generate-operation-registry.mjs --check
      - name: MCP drift gate (no unmapped flags/tools, no stale exemptions)
        run: pnpm run check:parity
      - name: "operation boundary ratchet (checks 1-9: identity, finality, no-bypass, executable deltas)"
        run: pnpm --filter @vibeflow-tools/cli exec vitest run
          tests/unit/operation-boundary.test.ts
      - name: "MCP parity regressions (shared-operation behavior)"
        run: pnpm --filter @vibeflow-tools/cli exec vitest run
          tests/unit/mcp/parity.test.ts
      - name: full CLI unit suite
        run: pnpm --filter @vibeflow-tools/cli run test

  release-gate:
    # Non-publishing dry-run that refuses stale/missing/failed evidence:
    # the registry artifact must match the checked-out commit exactly, or
    # the release is not promotable. Wire the publish pipeline to require
    # this job for the published SHA.
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: refuse stale registry evidence for this commit
        run: node packages/cli/scripts/generate-operation-registry.mjs --check
      - run: git status --short
