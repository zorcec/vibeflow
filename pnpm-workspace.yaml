packages:
  - "packages/*"

allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild
  - sharp

# fast-uri 3.1.6 carries two high-severity advisories:
# GHSA-qw65-cvwx-89v3, authority injection via an unvalidated port; and host
# confusion via an unclosed bracket in the URI authority. It reaches us
# transitively through ajv, via the runtime @modelcontextprotocol/sdk and the
# stryker devDependencies. 3.1.7 is the patched release and still satisfies
# ajv's range, so pin it here. pnpm v11 reads overrides from this file, not
# from the "pnpm" field in package.json.
overrides:
  "fast-uri": "^3.1.7"
  # glob@10.5.0 -> minimatch@9.0.9 -> brace-expansion@2.1.4, a dev-only chain
  # via @vitest/coverage-v8 > test-exclude. The root package.json floor of
  # ">=5.0.11" cannot cover it: forcing the 2.x line onto 5.x is a major bump
  # under minimatch@9. 2.1.6 is the patched release for GHSA-1240105 and
  # GHSA-1240109, so pin within 2.x rather than jumping majors.
  "minimatch@9>brace-expansion": "^2.1.7"
  # undici resolves to 7.29.0 under cheerio's "^7.19.0", one patch below the
  # 7.29.1 that fixes GHSA-w293-vg96-wgc3. This is a RUNTIME dependency, so it
  # ships to users. The root package.json "overrides" block carries a
  # "undici": ">=7.29.0" floor that looks like it covers this, but pnpm v11
  # ignores that block entirely -- the resolution stayed at 7.29.0 with the
  # floor set. It has to live here to do anything.
  "undici": "^7.29.1"
  # 5.0.9 was the previous floor and is now itself vulnerable
  # (GHSA-1240107 / GHSA-1240111). Scoped to the 5.x line so it cannot fight
  # the minimatch@9 > brace-expansion override above, which stays on 2.x.
  "brace-expansion@5": "^5.0.11"
  # All three of these reach the published CLI as RUNTIME dependencies, via
  # @modelcontextprotocol/sdk, and all three carried a floor in the root
  # package.json "overrides" block that never bound anything. The block has
  # been deleted; these are the entries from it that still had a live
  # advisory to clear. Floors are set to the highest patched version across
  # every open advisory for the package, not the lowest, so one entry clears
  # all of them.
  #
  #   qs          via sdk > express > body-parser   (2 advisories)
  #   ip-address  via sdk > express-rate-limit      (2 advisories)
  #   hono        via sdk > @hono/node-server       (1 advisory)
  "qs": ">=6.16.0"
  "ip-address": ">=10.7.1"
  "hono": ">=4.13.7"
  # esbuild 0.28.1 fixes GHSA on the tsup > bundle-require chain. Build-time
  # only and low severity, but it is a one-line floor.
  "esbuild": ">=0.28.1"
  # NOT pinned here: vitest and @vitest/mocker below 4.1.11 are moderate,
  # dev-only, and reachable only through @stryker-mutator/vitest-runner.
  # vitest is a PEER dependency of that runner (">=2.0.0"), so a scoped override
  # does not install anything -- it only rewrites the peer range. An attempt
  # here left the workspace with an unmet peer (installed 3.2.7, wanted
  # ^4.1.11), which is a worse state than the advisory. Clearing it needs
  # vitest 3 -> 4 repo-wide: a major bump with breaking changes, too large to
  # smuggle into a security patch. Tracked separately rather than half-fixed
  # here.
